<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>测试夹具：element-ui 控件表单</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 24px auto; }
    .el-form-item { margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
    .el-form-item__label { width: 110px; text-align: right; font-weight: 600; }
    .el-input__inner { padding: 6px 10px; border: 1px solid #dcdfe6; border-radius: 4px; width: 240px; }
    .el-select { cursor: pointer; }
    .el-select .el-input__inner { cursor: pointer; background: #fff; }
    .el-select-dropdown { position: fixed; left: 40px; top: 60px; z-index: 9999; background: #fff; border: 1px solid #e4e7ed; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .el-select-dropdown__item { padding: 8px 20px; cursor: pointer; list-style: none; }
    .el-select-dropdown__item:hover { background: #f5f7fa; }
    .el-select-dropdown__list { margin: 0; padding: 6px 0; }
  </style>
</head>
<body>
  <h1>element-ui 控件夹具</h1>
  <form onsubmit="return false">
    <div class="el-form-item">
      <label class="el-form-item__label" for="f-name">姓名</label>
      <input id="f-name" class="el-input__inner" name="name" type="text" />
    </div>

    <div class="el-form-item">
      <label class="el-form-item__label">性别</label>
      <div class="el-select" id="gender-select">
        <div class="el-input">
          <input class="el-input__inner" type="text" readonly placeholder="请选择" />
        </div>
      </div>
    </div>

    <div class="el-form-item">
      <label class="el-form-item__label">最高学历</label>
      <div class="el-select" id="edu-select">
        <div class="el-input">
          <input class="el-input__inner" type="text" readonly placeholder="请选择" />
        </div>
      </div>
    </div>
  </form>

  <script>
    function openDropdown(rootId, options, onPick) {
      const root = document.getElementById(rootId);
      root.addEventListener("click", () => {
        document.querySelectorAll(".el-select-dropdown").forEach((el) => el.remove());
        const dd = document.createElement("div");
        dd.className = "el-select-dropdown";
        dd.innerHTML = `<ul class="el-select-dropdown__list">` + options.map((t) => `<li class="el-select-dropdown__item"><span>${t}</span></li>`).join("") + "</ul>";
        dd.addEventListener("click", (e) => {
          const item = e.target.closest(".el-select-dropdown__item");
          if (!item) return;
          root.querySelector("input").value = item.innerText.trim();
          root.dataset.selected = item.innerText.trim();
          dd.remove();
        });
        document.body.appendChild(dd);
      });
    }
    openDropdown("gender-select", ["男", "女"]);
    openDropdown("edu-select", ["大专", "本科", "硕士", "博士"]);
  </script>
</body>
</html>
